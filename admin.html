<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord – Campagne de sensibilisation</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>

<header>
    <h1>Tableau de bord – Campagne de sensibilisation</h1>
</header>

<!-- ===== STATISTIQUES GLOBALES ===== -->
<section class="section-card">
    <h2>Statistiques globales</h2>

    <div class="stats-grid">
        <div class="stat-box">
            Ouvertures<br>
            <strong id="open-count">0</strong>
        </div>

        <div class="stat-box">
            Clics<br>
            <strong id="click-count">0</strong>
        </div>

        <div class="stat-box">
            Taux de clics<br>
            <strong id="ctr">0%</strong>
        </div>
    </div>
</section>

<!-- ===== ÉTUDIANTS AYANT CLIQUÉ ===== -->
<section class="section-card">
    <h2>Étudiants ayant cliqué</h2>
    <ul id="students-list">
        <!-- Liste générée automatiquement -->
    </ul>
</section>

<!-- ===== CLICS PAR PAGE ===== -->
<section class="section-card">
    <h2>Clics par page</h2>
    <ul class="page-clicks" id="page-clicks">
        <!-- Liste générée automatiquement -->
    </ul>
</section>

<!-- ===== SCRIPT DE RÉCUPÉRATION DES DONNÉES ===== -->
<script>
    fetch("fetch("https://script.google.com/macros/s/AKfycbzGB6k69f9u7L0yJWIpCoS-mUrGvX2kXUk_EvG3nBZsAZXnvkLZNS_M8n-7UqrsfAfBWw/exec?type=stats")
?type=stats")
        .then(res => res.json())
        .then(data => {

            // Statistiques globales
            document.getElementById("open-count").textContent = data.ouvertures;
            document.getElementById("click-count").textContent = data.clics;
            document.getElementById("ctr").textContent = data.taux + "%";

            // Étudiants ayant cliqué
            const studentsList = document.getElementById("students-list");
            data.etudiants.forEach(e => {
                const li = document.createElement("li");
                li.textContent = e;
                studentsList.appendChild(li);
            });

            // Clics par page
            const pageClicks = document.getElementById("page-clicks");
            Object.entries(data.pages).forEach(([page, count]) => {
                const li = document.createElement("li");
                li.textContent = `${page} : ${count}`;
                pageClicks.appendChild(li);
            });
        });
</script>

</body>
</html>
