<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin – Statistiques de la campagne</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Tableau de bord – Campagne de sensibilisation</h1>
</header>

<section>
    <h2>Statistiques globales</h2>
    <p><strong>Ouvertures :</strong> <span id="open-count">Chargement...</span></p>
    <p><strong>Clics :</strong> <span id="click-count">Chargement...</span></p>
    <p><strong>Taux de clics :</strong> <span id="ctr">Chargement...</span></p>
</section>

<section>
    <h2>Étudiants ayant cliqué</h2>
    <ul id="click-users">Chargement...</ul>
</section>

<section>
    <h2>Clics par page</h2>
    <ul id="click-pages">Chargement...</ul>
</section>

<section>
    <h2>Clics par étudiant</h2>
    <ul id="click-per-user">Chargement...</ul>
</section>

<script>
fetch("https://script.google.com/macros/s/AKfycbyeH8jC9eVzwqkMhj7WDrHeQiAc1d7G-KP9oilCmRs1zhIDnou6Hfv2RalDYxDL8hK-yQ/exec?type=stats")
    .then(r => r.json())
    .then(data => {

        document.getElementById("open-count").textContent = data.open;
        document.getElementById("click-count").textContent = data.click;
        document.getElementById("ctr").textContent = (data.click / data.open * 100).toFixed(1) + "%";

        document.getElementById("click-users").innerHTML =
            data.users.map(u => `<li>${u}</li>`).join("");

        document.getElementById("click-pages").innerHTML =
            data.pages.map(p => `<li>${p.page} : ${p.count}</li>`).join("");

        document.getElementById("click-per-user").innerHTML =
            data.clicksPerUser.map(c => `<li>${c.user} : ${c.count}</li>`).join("");
    });
</script>
<section>
    <h2>Rapport PDF</h2>
    <button id="download-pdf">Télécharger le rapport PDF</button>
</section>

<script>
document.getElementById("download-pdf").addEventListener("click", () => {
    window.open("https://script.google.com/macros/s/AKfycbyeH8jC9eVzwqkMhj7WDrHeQiAc1d7G-KP9oilCmRs1zhIDnou6Hfv2RalDYxDL8hK-yQ/exec?type=pdf", "_blank");
});
</script>

</body>
</html>
